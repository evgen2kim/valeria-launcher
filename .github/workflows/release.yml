name: Release

on:
  push:
    tags: ['v*-valeria.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Write signing config
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        if: env.HAS_SIGNING_KEY == 'true'
        run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always() && env.HAS_SIGNING_KEY == 'true'
        run: rm -f release.keystore keystore.properties

      - name: Verify the APK is signed
        if: env.HAS_SIGNING_KEY == 'true'
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="valeria-launcher-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"

          version_code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"

          # Idempotent on purpose. GitHub has delivered the same tag push twice, and the
          # second run then failed on "a release with the same tag name already exists" —
          # a red cross against a release that had in fact gone out perfectly well.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "$asset"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes "$asset"
          fi
